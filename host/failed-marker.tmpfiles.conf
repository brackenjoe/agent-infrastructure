# Goes to /etc/tmpfiles.d/failed-marker.conf. The failure markers of
# failed-marker@.service: root writes them, the agent user clears one with a
# plain rm after recording it (group write on the directory), so no sudo rule.
d /var/lib/fleet        0755 root root   -
d /var/lib/fleet/failed 0775 root claude -
